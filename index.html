<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lâmpada">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Lâmpada</title>
<meta name="theme-color" content="#F0EBD5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<style>
@font-face{font-family:'The Seasons';font-style:italic;font-weight:400;font-display:swap;src:url(fonts/the-seasons-italic.woff2) format('woff2')}
/* Paleta: Vanilla Cream #F0EBD5 (fundo), Dusty #A0817E (destaque e botões, texto creme por cima),
   rosinha #F5D5D2 (cartão do dia, o que é seu, menu ativo), marrom-dusty #5E4A48 (texto).
   Estilo angelical e limpo: fundo liso com halo de luz creme vindo de cima, seções com linha fina, pílulas, muito respiro.
   Itálico = The Seasons Italic. Resto = Poppins. */
:root{
  /* paleta (a escolhida no perfil sobrescreve estas cores; ver PALETAS no script) */
  --bg:#F0EBD5; --surface:#FBF8EE; --taupe:#5E4A48; --rosa:#A0817E; --rose-ink:#8E6E6B; --rose-num:var(--rosa); --blush:#F5D5D2;
  --steel:#B5A79B; --slate:#E4DDC6; --halo:#FFFDF6; --on-accent:#FBF8EE; --lume:#F3D98F;
  --ink-rgb:94,74,72; --accent-rgb:160,129,126; --soft-rgb:245,213,210; --surface-rgb:251,248,238; --deep-rgb:38,32,31;
  /* derivadas */
  --ink:var(--taupe); --line:var(--slate); --glass:var(--surface); --glass-line:var(--slate); --muted:rgba(var(--ink-rgb),.68);
  --rose:var(--rosa); --on-rose:var(--on-accent); --rose-soft:var(--blush); --soft:rgba(var(--soft-rgb),.55); --well:rgba(var(--accent-rgb),.32);
  --cocoa:var(--rosa); --on-cocoa:var(--on-accent); --tile:rgba(var(--accent-rgb),.14); --card:rgba(var(--surface-rgb),.78);
  --hero:rgba(var(--soft-rgb),.5); --ctx:rgba(var(--accent-rgb),.16); --tab-on:var(--blush); --tab-on-ink:var(--taupe); --ok:#7E9A90; --shadow:none;
  --f-sans:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-serif:'The Seasons',Georgia,serif;
  --r-card:28px; --r-ctl:999px; --pad:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#26201F; --surface:#322A28; --hero:#3A302E; --ink:#F0EBD5; --rose:#C4A5A1; --rose-ink:#D2B3AF; --rose-num:#D2B3AF;
  --card:rgba(255,255,255,.045); --glass:var(--surface); --glass-line:rgba(255,255,255,.06); --muted:var(--steel); --line:rgba(var(--accent-rgb),.16);
  --on-rose:var(--bg); --rose-soft:rgba(var(--soft-rgb),.12); --soft:rgba(var(--soft-rgb),.08); --well:rgba(var(--accent-rgb),.07);
  --cocoa:var(--blush); --on-cocoa:var(--taupe); --tile:rgba(var(--accent-rgb),.1); --ctx:rgba(var(--accent-rgb),.12);
  --tab-on:rgba(var(--soft-rgb),.14); --tab-on-ink:var(--blush); --ok:#A9C3B6; --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#26201F; --surface:#322A28; --hero:#3A302E; --ink:#F0EBD5; --rose:#C4A5A1; --rose-ink:#D2B3AF; --rose-num:#D2B3AF;
  --card:rgba(255,255,255,.045); --glass:var(--surface); --glass-line:rgba(255,255,255,.06); --muted:var(--steel); --line:rgba(var(--accent-rgb),.16);
  --on-rose:var(--bg); --rose-soft:rgba(var(--soft-rgb),.12); --soft:rgba(var(--soft-rgb),.08); --well:rgba(var(--accent-rgb),.07);
  --cocoa:var(--blush); --on-cocoa:var(--taupe); --tile:rgba(var(--accent-rgb),.1); --ctx:rgba(var(--accent-rgb),.12);
  --tab-on:rgba(var(--soft-rgb),.14); --tab-on-ink:var(--blush); --ok:#A9C3B6; --shadow:none; color-scheme:dark }
*{box-sizing:border-box}
html{background:var(--bg);touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* halo de luz suave vindo de cima + brilho rosa no canto (angelical, acolhedor) */
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(90px);background:var(--blush)}
body::before{width:max(130vw,900px);height:60vh;top:-34vh;left:50%;transform:translateX(-50%);opacity:1;background:var(--halo)}
body::after{width:min(70vw,480px);aspect-ratio:1;bottom:-26vh;left:-30vw;opacity:.7}
:root[data-theme="dark"] body::before,:root[data-theme="dark"] body::after{opacity:.06}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body::before,:root:not([data-theme="light"]) body::after{opacity:.06}}
body{background:transparent;min-height:100vh;color:var(--ink);font-family:var(--f-sans);font-weight:300;font-size:14px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--rose-ink)}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.lg{width:22px;height:22px}
.serif{font-family:var(--f-serif);font-style:italic;font-weight:400}

.shell{max-width:1180px;margin:0 auto;padding-block:20px 128px}
/* todas as páginas com a mesma largura, centralizadas */
.view{display:flex;flex-direction:column;gap:14px;max-width:720px;width:100%;margin:0 auto}
@keyframes in{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}

/* topo: marca do jeito Planê + saudação grande */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:4px 2px 10px}
.eyebrow{margin:0;font-size:12px;font-weight:400;color:var(--muted);display:flex;align-items:center;gap:7px}
.eyebrow svg.i{color:var(--rose);width:14px;height:14px}
.title{margin:4px 0 0;font-weight:300;font-size:30px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.title b{font-weight:500}
/* padrão da marca: título em duas cores, a última palavra em The Seasons itálico dusty (como "Marcos 3") */
.title em,.label em,.sh-title em{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:0;color:var(--rose-num)}
.title em{font-size:1.12em;padding-left:.08em}
.label em,.sh-title em{font-size:1.16em}
/* The Seasons pequena: só um pouco maior nos rótulos dos cartões rosados (sem negrito: a fonte não tem peso medium) */
.card.rose > .card-h .label em,.take .label em{font-size:1.36em;line-height:1}
.duo em{margin-left:.22em}
.top-r{display:flex;align-items:center;gap:8px;flex:none;align-self:flex-start}
.avatar{width:42px;height:42px;border-radius:50%;border:none;background:none;padding:0;overflow:hidden;display:flex;flex:none}
.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.round svg{width:19px;height:19px}
.ava-img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.ava-ini{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:var(--rose-soft);color:var(--ink);font-size:15px;font-weight:500}
.streak{display:inline-flex;align-items:center;gap:5px;height:36px;font-size:12.5px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px 0 12px;white-space:nowrap}
.streak svg{width:16px;height:16px;color:var(--rose)}

svg.sym{width:18px;height:18px;flex:none}
/* marca: o símbolo no formato do ícone do app */
svg.symt{width:36px;height:36px;flex:none;filter:drop-shadow(0 6px 14px rgba(var(--ink-rgb),.16))}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 4px}
.brandm{display:flex;align-items:center;gap:9px;border:0;background:none;padding:0;color:var(--ink);font-size:17px;font-weight:500;letter-spacing:-.03em}
.brandm i{font-style:normal;color:var(--rose)}
.nav .brand i{font-style:normal;color:var(--rose)}
/* cartões */
.card{position:relative;background:var(--card);border:0;border-radius:var(--r-card);padding:var(--pad);display:flex;flex-direction:column;gap:16px;min-width:0}
/* bloco do dia: blush liso */
.card.rose{background:var(--hero);border:0;border-radius:var(--r-card);padding:var(--pad);--line:rgba(var(--ink-rgb),.12);--tile:rgba(var(--surface-rgb),.7)}
:root[data-theme="dark"] .card.rose{--muted:rgba(var(--accent-rgb),.85);--line:rgba(var(--soft-rgb),.12);--tile:rgba(255,255,255,.07);--surface:rgba(255,255,255,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card.rose{--muted:rgba(var(--accent-rgb),.85);--line:rgba(var(--soft-rgb),.12);--tile:rgba(255,255,255,.07);--surface:rgba(255,255,255,.12)}}
.card.rose{color:var(--ink)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:24px}
.label{margin:0;font-size:12.5px;font-weight:500;color:var(--rose-ink);display:flex;align-items:center;gap:8px}
.label svg{width:15px;height:15px}
.label.muted{color:var(--muted)}
.card:not(.rose) > .card-h .label{font-size:18px;font-weight:400;color:var(--ink);letter-spacing:-.01em}
.card:not(.rose) > .card-h .label svg{display:none}
.small{font-size:12px;font-weight:400;color:var(--muted)}
.pill{height:28px;display:inline-flex;align-items:center;font-size:11.5px;font-weight:400;background:var(--tile);border:0;border-radius:999px;padding:0 13px;white-space:nowrap;color:var(--ink)}
.prose{margin:0;font-size:14.5px;line-height:1.75}
.hint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
.stack{display:flex;flex-direction:column;gap:12px}

/* herói */
.ref{margin:2px 0 0;font-weight:300;font-size:40px;line-height:1;letter-spacing:-.03em;display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;text-wrap:balance}
.ref .n{color:var(--rose-num);font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:1.25em;letter-spacing:0}
.ref .dsep{color:var(--muted)}
.sub{margin:8px 0 0;font-size:13px;font-weight:300;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--tile);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--rose);transition:width .6s ease}
.meta-row{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;font-weight:400;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;color:var(--ink)}
.day .wd{font-size:11px;font-weight:400;color:var(--muted)}
.day.today .wd{color:var(--rose-num)}
.day .sq{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;background:var(--tile);border:1.5px solid transparent;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums;transition:transform .15s}
.day .sq svg{width:16px;height:16px;stroke-width:1.6}
.day:hover .sq{transform:translateY(-1px)}
.day.future{opacity:.42;cursor:default}
.day.future:hover .sq{transform:none}
.tile.future{cursor:default}
.day.read .sq{background:var(--rose);border-color:transparent;color:var(--on-rose)}
.day.sel .sq{background:var(--surface);border-color:var(--rose);color:var(--rose-ink);font-weight:500}
.day.read.sel .sq{background:var(--rose);border-color:transparent;color:var(--on-rose);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--rose)}
.day .cap{display:none}

/* passos de hoje */
.steps{display:flex;flex-direction:column}
.step{border-top:1px solid var(--line)}
.step:first-child{border-top:none}
.step-h{width:100%;display:flex;align-items:center;gap:14px;border:none;background:none;text-align:left;padding:14px 0;color:var(--ink)}
.step:first-child .step-h{padding-top:2px}
.num{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;font-weight:400;border:1px solid var(--slate);background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.num svg{width:17px;height:17px;stroke-width:1.6}
.step.open .num{background:var(--blush);border-color:transparent;color:var(--taupe)}
.step.done .num{background:var(--rose);border-color:transparent;color:var(--on-rose)}
.step-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.step-t b{font-size:15px;font-weight:400}
.step-t span{font-size:12px;color:var(--muted)}
.chev{color:var(--muted);transition:transform .2s}
.step.open .chev{transform:rotate(90deg)}
.step-b{padding:0 0 18px 52px;display:flex;flex-direction:column;gap:14px}
.finish{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.done-ring{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:999px;padding:8px 18px 8px 8px}
.done-ring .ring{width:46px;height:46px;border-radius:50%;background:var(--rose);color:var(--on-rose);display:flex;align-items:center;justify-content:center;flex:none}
.done-ring .ring svg{width:22px;height:22px;stroke-width:1.6}
.done-ring b{font-weight:500;font-size:14px;display:block}
.done-ring span{font-size:12.5px;color:var(--muted)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}

/* botões: pílulas */
.btn{min-height:48px;border-radius:var(--r-ctl);border:1px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:400;text-decoration:none;padding:8px 18px;text-align:center;line-height:1.25;transition:transform .12s,filter .12s;width:100%}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.04)}
.btn.primary,.btn.cocoa{background:var(--cocoa);color:var(--on-cocoa)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.done{background:var(--soft);color:var(--ink)}
.btn.big{min-height:54px;font-size:14px;font-weight:500}
.btn[disabled]{opacity:.55;cursor:default}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.linkbtn{border:none;background:none;color:var(--rose-ink);font-size:12.5px;font-weight:400;padding:4px 0;display:inline-flex;align-items:center;gap:4px;align-self:flex-start;text-decoration:none}
.linkbtn.muted{color:var(--muted)}

/* conteúdo dos passos */
.take{position:relative;background:var(--hero);color:var(--taupe);border-radius:24px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.take .label{color:var(--rose-ink)}
.take .serif{font-size:23px;line-height:1.25}
:root[data-theme="dark"] .take{background:var(--rose-soft);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .take{background:var(--rose-soft);color:var(--ink)}}
.ctx{background:var(--ctx);border-radius:22px;padding:14px 16px;font-size:13px;line-height:1.65;color:var(--ink)}
.ctx b{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
.thinking{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);min-height:24px}
.dots{display:inline-flex;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rose);opacity:.35;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--well);border-radius:999px;padding:4px}
.seg button{min-height:40px;border:none;border-radius:999px;background:transparent;font-size:12.5px;font-weight:400;color:var(--muted);padding:4px 8px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--cocoa);color:var(--on-cocoa);font-weight:500}
.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.side > div{display:flex;flex-direction:column;gap:4px;min-width:0}
.side > div:first-child{padding-right:14px;border-right:1px solid var(--line)}
.side > div:last-child{padding-left:14px}
.v{font-size:11px;font-weight:500;letter-spacing:.08em}
.v.ntlh{color:var(--rose-ink)} .v.alm{color:var(--steel)}
.w{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);padding-top:12px;row-gap:6px}
.w .q{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:19px;line-height:1.3;min-width:0}
.w .q:first-of-type{padding-right:14px;border-right:1px solid var(--line)}
.w .q + .q{padding-left:14px}
.w .vs{grid-column:1/-1;font-size:11px;font-weight:500;color:var(--muted)}
.w .why{grid-column:1/-1;font-size:12.5px;line-height:1.55;color:var(--muted)}
.gloss{display:flex;flex-direction:column}
.g{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:12px 0}
.gloss > .g:first-child{border-top:none;padding-top:0}
.g > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.g .t{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:21px;line-height:1.2}
.g .s{font-size:13px;line-height:1.55;color:var(--muted)}
.g .r{font-size:11px;color:var(--rose-ink);font-weight:500}
.star{width:40px;height:40px;border-radius:50%;border:1px solid var(--slate);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.star.on{background:var(--rose);border-color:transparent;color:var(--on-rose)}
.star.on svg{fill:currentColor}

/* campos: pílula com botão redondo (referência "Find a memory…") */
.ask{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 20px;min-height:56px}
.ask:focus-within{border-color:var(--rose)}
.ask input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-weight:300;font-size:16px;height:48px}
.ask input::placeholder,.inp::placeholder,textarea::placeholder{color:var(--muted)}
.send{width:44px;height:44px;border-radius:50%;border:none;background:var(--cocoa);color:var(--on-cocoa);display:flex;align-items:center;justify-content:center;flex:none}
.send[disabled]{opacity:.45}
.note-area{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:24px;background:var(--surface);padding:14px 18px;font-weight:300;font-size:16px;line-height:1.7;outline:none}
.note-area:focus{border-color:var(--rose)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:12px;font-weight:500;color:var(--muted)}
.inp{height:50px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);padding:0 20px;font-weight:300;font-size:16px;outline:none;width:100%;min-width:0;color:var(--ink)}
select.inp{appearance:none;-webkit-appearance:none}
.inp:focus{border-color:var(--rose)}
.row-add{display:flex;gap:8px}
.row-add .btn{width:auto;flex:none}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.form-grid{grid-template-columns:minmax(0,1fr)}}
/* celular: botões que o ícone já explica ficam só com o ícone */
@media (max-width:600px){
  .io .bt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .btn.io{width:44px;min-width:44px;min-height:44px;padding:0;flex:none;border-radius:50%}
  .btn.io .i{margin:0}
  .g.vs > .acts{gap:4px}
  .linkbtn.io{min-width:36px;min-height:36px;justify-content:center;padding:6px}
  .linkbtn.io .i{width:18px;height:18px}
  .foco-acts > .btn.io{width:52px;min-height:52px;flex:none}
}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:11px 14px;font-size:12.5px;font-weight:400;text-align:left;line-height:1.35;color:var(--ink);min-height:46px}
.picked{display:flex;flex-wrap:wrap;gap:8px}
.bchip{display:inline-flex;align-items:center;gap:6px;height:34px;border-radius:999px;border:none;background:var(--soft);color:var(--ink);padding:0 10px 0 14px;font-size:12.5px;font-weight:400}
.bchip svg{width:14px;height:14px}
.preview{background:var(--soft);border-radius:22px;padding:14px 16px;font-size:13px;line-height:1.55}
.preview b{font-weight:500}

/* linhas de lista */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;border:none;background:none;text-align:left;padding:12px 0;border-top:1px solid var(--line);color:var(--ink);width:100%;text-decoration:none}
.list > .li:first-child{border-top:none;padding-top:2px}
.li .lt{flex:1;min-width:0;font-size:14px;font-weight:400;display:flex;flex-direction:column;line-height:1.35}
.li .lt small{font-size:11.5px;color:var(--muted);font-weight:300}
.li > svg{color:var(--muted)}
.li.done .num{background:var(--rose);border-color:transparent;color:var(--on-rose)}
.li.next .num{background:var(--blush);border-color:transparent;color:var(--taupe)}

/* aviso */
.banner{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 8px;text-align:left;width:100%;color:var(--ink)}
.banner .ic{width:38px;height:38px;border-radius:50%;background:var(--rose-soft);color:var(--rose-ink);display:flex;align-items:center;justify-content:center;flex:none}
.banner > span:nth-child(2){font-size:13px;line-height:1.4;min-width:0;flex:1}
.banner b{font-weight:500}
.banner > svg{color:var(--muted)}

/* grade do hoje */

/* planos */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.plan-pick{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0;color:var(--ink);min-height:118px}
.plan-pick.on{background:var(--soft);border-color:var(--rose);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15)}
.plan-pick b{font-weight:500;font-size:14.5px;line-height:1.3}
.plan-pick .small{line-height:1.4;flex:1}
.plan-pick.add{align-items:center;justify-content:center;border-style:dashed;border-color:var(--slate);background:transparent;color:var(--ink);font-weight:400;text-align:center;gap:4px}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stat{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat > div{background:var(--tile);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;min-width:0}
.stat b{font-weight:300;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);line-height:1.35}
.book{display:flex;flex-direction:column;gap:10px}
.book h3{margin:0;font-weight:400;font-size:15px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.book h3 span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.tile{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;font-variant-numeric:tabular-nums;min-width:0;color:var(--ink)}
.tile b{font-weight:400;font-size:13.5px;line-height:1}
.tile small{font-size:9px;color:var(--muted);line-height:1}
.tile.read{background:var(--rose);border-color:transparent;color:var(--on-rose)}
.tile.read small{color:var(--on-rose);opacity:.85}
.tile.today{background:var(--surface);border:1.5px solid var(--rose);color:var(--rose-ink)}
.tile.future{opacity:.6}
.sep{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-weight:400;margin:0}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.bks{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
.bk{display:flex;flex-direction:column;gap:5px;background:var(--tile);border-radius:14px;padding:8px 9px;min-width:0}
.bk span{font-size:11px;font-weight:400;color:var(--muted);line-height:1}
.bk i{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bk i b{display:block;height:100%;background:var(--rose)}
.bk.full{background:var(--rose)} .bk.full span{color:var(--on-rose)} .bk.full i{background:rgba(var(--surface-rgb),.35)} .bk.full i b{background:var(--on-rose)}
details.fold > summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.fold > summary::-webkit-details-marker{display:none}
details.fold[open] > summary .chev{transform:rotate(90deg)}
.danger{color:var(--rose-ink);background:none;border:none;font-size:12.5px;text-decoration:underline;padding:4px 0;align-self:flex-start}

/* diário */
.entry{text-align:left;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;width:100%;color:var(--ink)}
.entry .em{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted)}
.entry .em b{color:var(--ink);font-weight:500}
.entry p{margin:0;font-size:13.5px;line-height:1.65;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;padding:28px 18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:28px;height:28px;color:var(--rose)}

/* conversa */
.engine{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.eng{min-height:56px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;text-align:left;color:var(--ink)}
.eng b{display:block;font-size:13.5px;font-weight:500;line-height:1.2}
.eng small{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);line-height:1.2}
.eng small i{width:6px;height:6px;border-radius:3px;background:var(--steel);flex:none}
.eng small i.on{background:var(--ok)}
.eng[aria-pressed="true"]{background:var(--soft);border-color:var(--rose)}
.eng .mk{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.eng[aria-pressed="true"] .mk{background:var(--rose);color:var(--on-rose)}
.ctxsel{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.ctxsel button{flex:none;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;padding:0 16px;color:var(--muted);white-space:nowrap}
.ctxsel button[aria-pressed="true"]{background:var(--cocoa);border-color:transparent;color:var(--on-cocoa)}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 18px;border-radius:24px;font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--blush);color:var(--taupe);border-bottom-right-radius:8px}
.msg.ai{align-self:flex-start;background:var(--glass);border:1px solid var(--line);border-bottom-left-radius:8px}
.msg .who{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--rose-ink);margin-bottom:4px}


/* tela de entrada */
body.w-on .nav,body.w-on .fab{display:none}
body.w-on .shell{padding-left:0;padding-right:0}
.welcome{max-width:460px;margin:0 auto;min-height:calc(100vh - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px 8px}
.w-mark svg.symt{width:96px;height:96px;filter:drop-shadow(0 18px 30px rgba(var(--ink-rgb),.22))}
.w-word{margin:4px 0 0;font-size:22px;font-weight:500;letter-spacing:-.03em}
.w-word i{font-style:normal;color:var(--rose)}
.w-title{font-size:30px;margin:6px 0 0}
.w-sub{margin:0;color:var(--muted);font-size:14px;line-height:1.65;max-width:380px}
.w-btn{margin-top:14px;max-width:340px}
.w-note{margin:0;font-size:12px;color:var(--muted)}
.w-g{background:var(--surface)}
.w-or{display:flex;align-items:center;gap:10px;width:100%;max-width:340px;margin:6px 0 0;font-size:11.5px;color:var(--muted)}
.w-or::before,.w-or::after{content:"";flex:1;height:1px;background:var(--line)}
.w-form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.w-form .w-btn{margin-top:2px;max-width:none}
.w-err{margin:0;font-size:12.5px;color:var(--rose-ink);font-weight:500}
/* animações só ao chegar numa página, abrir um passo ou concluir (sem piscar a cada toque) */
body.a-view .view,body.a-view .welcome{animation:in .4s ease both}
body.a-step .step.open .step-b{animation:in .25s ease both}
body.a-done .done-ring .ring{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
body.a-upd .upd{animation:in .4s ease both}
/* troca de paleta e de claro/escuro: as cores mudam suavemente */
html{transition:background-color .45s ease}
html.morph *,html.morph *::before,html.morph *::after{transition:background-color .45s ease,color .45s ease,border-color .45s ease,fill .45s ease,stroke .45s ease,box-shadow .45s ease!important}
.inp.masked{-webkit-text-security:disc}
.keyrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-6px}
.keyrow .mono{font-weight:500;letter-spacing:.06em}
/* aviso de versão nova */
.upd{position:fixed;z-index:35;top:calc(74px + env(safe-area-inset-top, 0px));left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:10px;
  background:var(--rosa);color:var(--on-accent);border:0;border-radius:999px;padding:8px 8px 8px 16px;font-size:13px;box-shadow:0 14px 30px -12px rgba(var(--ink-rgb),.5);white-space:nowrap}
.upd b{font-weight:500;background:var(--on-accent);color:var(--rosa);border-radius:999px;padding:6px 14px}
/* rodapé: assinatura discreta */
.foot{max-width:720px;margin:36px auto 0;text-align:center;font-size:11.5px;color:var(--muted);opacity:.8}
.foot i{font-style:normal;color:var(--rose)}
.foot em{font-family:var(--f-serif);font-style:italic;font-size:1.25em}
/* perfil */
.me-row{display:flex;align-items:center;gap:18px}
.ava-big{width:88px;height:88px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 4px var(--surface)}
.ava-big .ava-ini{font-size:34px;font-weight:300;font-family:var(--f-serif);font-style:italic}
.me-name{margin:0;font-size:22px;font-weight:300;line-height:1.2;letter-spacing:-.01em}
.me-btns{display:flex;flex-wrap:wrap;gap:8px}
.btn.sm{width:auto;min-height:40px;font-size:12.5px;padding:6px 16px}
label.btn{cursor:pointer}
.crop-wrap{display:flex;justify-content:center;padding:6px 0}
.crop{position:relative;width:min(240px,68vw);aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--surface);touch-action:none;cursor:grab;box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--line)}
.crop img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
input[type=range]{width:100%;accent-color:var(--rosa)}
/* iPhone: campos de data e hora ignoram a largura e passam da borda do cartão */
input.inp[type=date],input.inp[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;line-height:48px;text-align:left}
input.inp[type=date]::-webkit-date-and-time-value,input.inp[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
.seg button svg.i{width:15px;height:15px;vertical-align:-3px;margin-right:2px}
.pals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.pals{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pal{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:13px 14px;display:flex;flex-direction:column;gap:9px;color:var(--ink);min-width:0}
.pal.on{border-color:var(--rose);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
.pal .tag{font-size:10.5px;color:var(--rose-ink);font-weight:500;margin-left:6px}
.pal-sw{display:flex;padding-left:6px}
.pal-sw i{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);margin-left:-8px}
.pal b{font-weight:500;font-size:13.5px;line-height:1.2}
.pal small{font-size:11px;color:var(--muted);line-height:1.35}
[data-sync].bad{color:var(--rose-ink)}
.grp{scroll-margin-top:20px;margin:18px 6px -2px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.nav-me{display:none}
.hero-r{display:flex;align-items:center;gap:8px}
.round.sm{width:32px;height:32px;background:var(--tile);border:0}
.round.sm svg{width:16px;height:16px}
.fala{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.fala svg{width:15px;height:15px}
.msg .who .fala{margin-left:auto;padding:0 0 0 8px}
.msg .who{width:100%}
body.foco-on .nav,body.foco-on .fab,body.foco-on .appbar{display:none}
body.foco-on .shell{padding-left:0;padding-right:0}
.view.foco{max-width:640px;gap:20px;padding-top:8px}
.foco-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.foco-ref{justify-content:center;text-align:center;font-size:52px;margin-top:18px}
.foco-txt{font-size:16.5px;line-height:1.85}
.foco-ler{margin-top:6px}
.foco-acts{display:flex;gap:10px}
.foco-acts > *{flex:1}
.semana .stat b{font-size:24px}
.passos{margin:12px 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.6;color:var(--ink)}
.passos b{font-weight:500}
.minbtn .i{transform:rotate(-90deg);transition:transform .2s}
.semana.min .minbtn .i{transform:rotate(90deg)}
.semana.min{gap:0}
.semana.min > .card-h{margin:0}
.nav .tab-busca{display:none}
.bib-sobre{font-size:14px;line-height:1.7;color:var(--muted);margin:0}
.junto{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;color:var(--muted)}
.junto svg{width:15px;height:15px;color:var(--rose-ink);flex:none}
.junto b{font-weight:500;color:var(--rose-ink)}
.codigo{display:flex;align-items:center;gap:12px;background:var(--rose-soft, var(--surface));border-radius:var(--r-ctl);padding:10px 10px 10px 18px}
.codigo .small{white-space:nowrap}
.codigo b{font-weight:500;font-size:20px;letter-spacing:.14em;color:var(--rose-ink);flex:1;font-variant-numeric:tabular-nums}
.amigo .ava-s{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--rose-soft, var(--line));color:var(--rose-ink);font-size:15px}
.amigo .ava-s img{width:100%;height:100%;object-fit:cover}
.amigo .ok{color:var(--rose-ink);display:grid}
.amigo .ok svg{width:18px;height:18px}
.hint.warn{color:var(--rose-ink)}
.caps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.caps-grid .chip{min-height:40px;padding:0;text-align:center;border-radius:14px}
.vs{display:flex;flex-direction:column;gap:6px}
.vs .t{font-family:var(--f-serif);font-style:italic;font-size:20px;line-height:1.35}
.vs .r{font-size:12px;font-weight:500;color:var(--rose-ink)}
.g.vs > .acts{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px 16px;flex:none}
.syms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.syms{grid-template-columns:repeat(4,minmax(0,1fr))}}
.symb{border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);min-width:0}
.symb svg.symt{width:52px;height:52px}
.symb small{font-size:10.5px;color:var(--muted);line-height:1.25;text-align:center}
.symb.on{border-color:var(--rose);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
/* chat flutuante: botão redondo + painel */
.fab{position:fixed;z-index:25;right:max(18px, env(safe-area-inset-right, 0px));bottom:calc(96px + env(safe-area-inset-bottom, 0px));width:58px;height:58px;border-radius:50%;border:none;
  background:var(--rosa);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -12px rgba(var(--ink-rgb),.55);transition:transform .2s}
.fab:active{transform:scale(.94)}
.fab svg{width:25px;height:25px;stroke-width:1.4}
.fab.busy::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--blush);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.chat-open .fab{display:none}
body.chat-open{overflow:hidden}
.scrim{position:fixed;inset:0;z-index:39;background:rgba(var(--deep-rgb),.28)}
.sheet{position:fixed;z-index:40;left:0;right:0;bottom:0;height:min(88vh,860px);background:var(--bg);border-radius:30px 30px 0 0;box-shadow:0 -20px 50px -20px rgba(var(--deep-rgb),.35);
  display:flex;flex-direction:column;padding:10px 18px calc(14px + env(safe-area-inset-bottom, 0px));overflow:hidden}
.sheet.anim{animation:up .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet::before{content:"";align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line);margin-bottom:8px;flex:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;padding:4px 2px 12px}
.sh-title{margin:0;font-weight:300;font-size:24px;letter-spacing:-.02em;line-height:1.1}
.sh-x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.sh-tools{display:flex;flex-direction:column;gap:10px;flex:none;padding-bottom:12px}
.sh-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 12px;overscroll-behavior:contain}
.sh-foot{flex:none;padding-top:8px}
.sh-mid{flex:1;min-width:0}
.sh-mid .sh-title{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-mid .small{margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-acts{display:flex;gap:8px;flex:none}
.sh-x{position:relative}
.sh-x .cnt{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--rosa);color:var(--on-accent);font-size:10px;font-style:normal;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0 5px}
.cvs .li.on .num{background:var(--blush);border-color:transparent}
.ask textarea{flex:1;min-width:0;border:none;outline:none;background:transparent;font:inherit;font-weight:300;font-size:16px;resize:none;padding:15px 0;line-height:1.45;max-height:140px;color:var(--ink)}
.ask textarea::placeholder{color:var(--muted)}
.sh-note{font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
@media (min-width:640px) and (max-width:1099px){
  .sheet{left:50%;right:auto;width:min(640px,calc(100vw - 48px));transform:translateX(-50%);bottom:24px;border-radius:30px;height:min(80vh,820px)}
  .sheet.anim{animation:upc .32s cubic-bezier(.2,.8,.2,1) both}
  @keyframes upc{from{transform:translate(-50%,40px);opacity:0}to{transform:translateX(-50%);opacity:1}}
  .sheet::before{display:none}
  .fab{right:24px;bottom:calc(19px + env(safe-area-inset-bottom, 0px))}
}

.nav{position:fixed;z-index:20;left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));
  bottom:calc(14px + env(safe-area-inset-bottom, 0px));height:66px;max-width:340px;margin:0 auto;border-radius:999px;

.toast.show{opacity:1;transform:translate(-50%,0)}

}

<script>
(() => {
const BIBLIA = ('GEN|Gênesis|Gn|50;EXO|Êxodo|Êx|40;LEV|Levítico|Lv|27;NUM|Números|Nm|36;DEU|Deuteronômio|Dt|34;JOS|Josué|Js|24;JDG|Juízes|Jz|21;RUT|Rute|Rt|4;1SA|1 Samuel|1Sm|31;2SA|2 Samuel|2Sm|24;1KI|1 Reis|1Rs|22;2KI|2 Reis|2Rs|25;1CH|1 Crônicas|1Cr|29;2CH|2 Crônicas|2Cr|36;EZR|Esdras|Ed|10;NEH|Neemias|Ne|13;EST|Ester|Et|10;JOB|Jó|Jó|42;PSA|Salmos|Sl|150;PRO|Provérbios|Pv|31;ECC|Eclesiastes|Ec|12;SNG|Cânticos|Ct|8;ISA|Isaías|Is|66;JER|Jeremias|Jr|52;LAM|Lamentações|Lm|5;EZK|Ezequiel|Ez|48;DAN|Daniel|Dn|12;HOS|Oseias|Os|14;JOL|Joel|Jl|3;AMO|Amós|Am|9;OBA|Obadias|Ob|1;JON|Jonas|Jn|4;MIC|Miqueias|Mq|7;NAM|Naum|Na|3;HAB|Habacuque|Hc|3;ZEP|Sofonias|Sf|3;HAG|Ageu|Ag|2;ZEC|Zacarias|Zc|14;MAL|Malaquias|Ml|4;MAT|Mateus|Mt|28;MRK|Marcos|Mc|16;LUK|Lucas|Lc|24;JHN|João|Jo|21;ACT|Atos|At|28;ROM|Romanos|Rm|16;1CO|1 Coríntios|1Co|16;2CO|2 Coríntios|2Co|13;GAL|Gálatas|Gl|6;EPH|Efésios|Ef|6;PHP|Filipenses|Fp|4;COL|Colossenses|Cl|4;1TH|1 Tessalonicenses|1Ts|5;2TH|2 Tessalonicenses|2Ts|3;1TI|1 Timóteo|1Tm|6;2TI|2 Timóteo|2Tm|4;TIT|Tito|Tt|3;PHM|Filemom|Fm|1;HEB|Hebreus|Hb|13;JAS|Tiago|Tg|5;1PE|1 Pedro|1Pe|5;2PE|2 Pedro|2Pe|3;1JN|1 João|1Jo|5;2JN|2 João|2Jo|1;3JN|3 João|3Jo|1;JUD|Judas|Jd|1;REV|Apocalipse|Ap|22')
  .split(';').map((s, i) => { const [c, n, ab, caps] = s.split('|'); return { c, n, ab, caps:+caps, nt: i >= 39 }; });

const BK = Object.fromEntries(BIBLIA.map(b => [b.c, b]));
const TOTAL_CAPS = BIBLIA.reduce((a, b) => a + b.caps, 0);
const AT = BIBLIA.filter(b => !b.nt).map(b => b.c), NT = BIBLIA.filter(b => b.nt).map(b => b.c);
const PERFIL = 'lais';
const ESTUDOS = [
  { id:'amor',     nome:'O amor de Deus',      sub:'7 dias pra sentir o tamanho desse amor', dias:['JHN.3','LUK.15','ROM.8','1JN.4','PSA.103','EPH.2','1CO.13'] },
  { id:'oracao',   nome:'Aprender a orar',      sub:'7 dias com as orações da Bíblia',        dias:['MAT.6','LUK.11','PSA.23','PSA.51','PHP.4','JHN.17','PSA.139'] },
  { id:'jesus',    nome:'Quem é Jesus',         sub:'7 dias olhando pra ele de vários jeitos', dias:['JHN.1','COL.1','HEB.1','PHP.2','ISA.53','LUK.24','REV.1'] },
  { id:'coragem',  nome:'Coragem e confiança',  sub:'7 dias pra quando o coração aperta',      dias:['JOS.1','PSA.27','PSA.91','ISA.40','ROM.5','2CO.4','HEB.11'] }
];

/* trilha: do básico ao profundo */
const NIVEIS = [
  { n:1, nome:'primeiros passos', sub:'o que é a Bíblia e como ler' },
  { n:2, nome:'a grande história', sub:'do começo até o tempo de Jesus' },
  { n:3, nome:'conhecer Jesus', sub:'quem ele é e o que ele fez' },
  { n:4, nome:'vida com Deus', sub:'oração, graça e comunidade' },
  { n:5, nome:'aprofundar', sub:'ler com contexto e ver o todo' }
];
const AULAS = [
  { id:'biblia', nv:1, t:'O que é a Bíblia', ler:'', p:[
    'A Bíblia não é um livro só. Ela é uma pequena biblioteca: são 66 livros nas Bíblias evangélicas e 73 nas católicas, que incluem alguns livros a mais no Antigo Testamento.',
    'Ela foi escrita ao longo de mais de mil anos, por dezenas de autores diferentes: reis, pastores, pescadores, um médico, um cobrador de impostos. Os idiomas originais são o hebraico, um pouco de aramaico e o grego.',
    'Mesmo com tantos autores, ela conta uma grande história: Deus criou o mundo, a humanidade se afastou dele, e Deus vem buscando as pessoas de volta. Para os cristãos, essa história chega ao centro em Jesus.'],
    q:'O que você espera encontrar nessa leitura?' },
  { id:'testamentos', nv:1, t:'Antigo e Novo Testamento', ler:'', p:[
    'A Bíblia tem duas grandes partes. O Antigo Testamento conta o que aconteceu antes de Jesus: a criação, a história do povo de Israel, as leis, as orações e os profetas. São 39 livros nas Bíblias evangélicas.',
    'O Novo Testamento começa com a vida de Jesus nos quatro evangelhos, mostra como as primeiras igrejas nasceram e reúne as cartas escritas para elas. São 27 livros.',
    '"Testamento" aqui quer dizer aliança, um compromisso entre Deus e as pessoas. O Novo não apaga o Antigo: um ajuda a entender o outro.'],
    q:'Você já tinha ouvido falar de algum livro do Antigo Testamento?' },
  { id:'versiculo', nv:1, t:'Como achar um versículo', ler:'MRK.2', p:[
    'Quando alguém fala "Marcos 2:5", são três informações: o livro (Marcos), o capítulo (2) e o versículo (5), que é uma frase ou um pedacinho do capítulo.',
    'Os autores não escreveram com números. Os capítulos foram criados por volta do ano 1200 e os versículos, por volta de 1550, só para ficar mais fácil achar os trechos.',
    'Por isso às vezes um capítulo termina no meio de uma história. Vale ler um pouco antes e um pouco depois para não perder o fio.'],
    q:'Abra Marcos 2 e tente achar o versículo 5 sozinha.' },
  { id:'traducoes', nv:1, t:'Por que existem traduções diferentes', ler:'', p:[
    'Como a Bíblia foi escrita em outros idiomas, toda Bíblia em português é uma tradução. Os tradutores sempre precisam escolher entre ficar mais perto das palavras originais ou mais perto do jeito que a gente fala.',
    'A Almeida, de 1681 e revisada várias vezes, fica bem perto das palavras originais e tem um português mais clássico. A NTLH, de 2000, traduz a ideia de cada frase no português do dia a dia, do jeito que a gente fala.',
    'Nenhuma delas está errada. Comparar as duas, como no seu lado a lado, é um ótimo jeito de entender melhor.'],
    q:'Qual das duas formas de escrever te soa mais próxima?' },
  { id:'generos', nv:1, t:'Os tipos de livro da Bíblia', ler:'PSA.23', p:[
    'Assim como numa biblioteca há romance, poesia e cartas, a Bíblia tem tipos diferentes de texto: leis, histórias, poesia e canções (como os Salmos), sabedoria (como Provérbios), profecias, evangelhos, cartas e o Apocalipse, que usa muitas imagens e símbolos.',
    'Cada tipo se lê de um jeito. Poesia fala ao coração com imagens, carta responde a problemas de uma igreja específica, profecia chama o povo de volta para Deus.',
    'Perguntar "que tipo de texto é este?" já resolve muita confusão.'],
    q:'Leia o Salmo 23. Que imagens ele usa para falar de Deus?' },
  { id:'criacao', nv:2, t:'A criação e o afastamento', ler:'GEN.1', p:[
    'A Bíblia começa com Deus criando tudo e chamando o que fez de bom. O ser humano é criado à imagem de Deus, para viver em relação com ele, com os outros e com a criação.',
    'Em Gênesis 3, as pessoas escolhem seguir o próprio caminho em vez de confiar em Deus. A Bíblia chama isso de pecado, e a partir daí a relação fica quebrada.',
    'O resto da Bíblia mostra Deus agindo para restaurar o que se perdeu.'],
    q:'O que te chama atenção no jeito como Deus cria?' },
  { id:'abraao', nv:2, t:'Abraão e a promessa', ler:'GEN.12', p:[
    'Deus chama um homem chamado Abraão e promete que dele nascerá um povo, e que por meio desse povo todas as famílias da terra seriam abençoadas.',
    'Abraão não era perfeito, mas confiou. Essa confiança, a fé, vira um exemplo para toda a Bíblia.',
    'Dele vêm Isaque, Jacó e as doze tribos de Israel. Guarde essa promessa: ela volta muitas vezes.'],
    q:'Como seria deixar tudo para trás confiando numa promessa?' },
  { id:'exodo', nv:2, t:'Moisés e a libertação', ler:'EXO.14', p:[
    'Os descendentes de Abraão vão para o Egito e acabam escravizados. Deus chama Moisés para libertar o povo, e eles atravessam o mar rumo à liberdade. Esse é o êxodo, a "saída".',
    'No deserto, Deus faz uma aliança com o povo e dá os Dez Mandamentos, um jeito de viver como povo de Deus.',
    'Para Israel, o êxodo vira a grande lembrança de que Deus liberta. A Páscoa judaica celebra justamente isso.'],
    q:'De que você gostaria de ser libertada hoje?' },
  { id:'reis', nv:2, t:'Reis, exílio e profetas', ler:'2SA.7', p:[
    'Israel ganha reis. O mais lembrado é Davi, que recebe a promessa de que um descendente dele reinaria para sempre. Depois o reino se divide e muitos reis se afastam de Deus.',
    'Os profetas são pessoas que Deus envia para chamar o povo de volta. Mesmo assim, o povo acaba levado para longe, para a Babilônia. Isso se chama exílio.',
    'No meio dessa tristeza, os profetas anunciam esperança: um dia viria um rei ungido, o Messias.'],
    q:'Por que você acha que a esperança aparece justo nos tempos difíceis?' },
  { id:'epoca', nv:2, t:'O mundo no tempo de Jesus', ler:'', p:[
    'Entre o último livro do Antigo Testamento e o nascimento de Jesus passam uns 400 anos. Quando Jesus nasce, a terra de Israel está sob o domínio do Império Romano.',
    'Aparecem grupos que você vai ver nos evangelhos: fariseus, muito rigorosos com a lei; saduceus, ligados ao templo; samaritanos, vizinhos que os judeus evitavam; cobradores de impostos, que trabalhavam para Roma.',
    'O povo esperava o Messias, muitos imaginando um líder que expulsaria os romanos. Jesus surpreende essas expectativas.'],
    q:'Quais desses grupos você já encontrou em Marcos?' },
  { id:'evangelhos', nv:3, t:'Por que quatro evangelhos', ler:'', p:[
    '"Evangelho" quer dizer boa notícia. São quatro relatos da vida de Jesus, cada um com um olhar.',
    'Marcos é o mais curto e direto, cheio de ação. Mateus escreve pensando nos judeus e mostra Jesus cumprindo as promessas antigas. Lucas é detalhista e cuida dos esquecidos: mulheres, pobres, estrangeiros. João, o mais diferente, foca em quem Jesus é.',
    'É como quatro amigos contando a mesma pessoa: as diferenças completam o retrato.'],

  if (e === 'gemini') return { engine:e, text:await geminiCall(turns, { onText, signal }) };
  try { const r = await S.sample(turns, { cache:false, signal, onText:({ text }) => onText(text) }); return { engine:e, text:r.text }; }
  catch (x) { throw new AIError(x && x.code || 'upstream', '', x && x.text); }
}

async function prepararSemana(){
  const p = plan(), t = Math.max(0, todayIdx(p));
  const alvo = p.days.slice(t, t + 7).filter(d => !capOf(d.key).resumo);
  if (!alvo.length) return toast('as explicações da semana já estão prontas');
  if (S.busy.semana) return; S.busy.semana = true; render();
  try {
    const r = await aiJSON(`Prepare explicações para estas leituras, nesta ordem: ${alvo.map(refName).join('; ')}.\nResponda só com um array JSON, um objeto por leitura, na mesma ordem:\n[{"titulo":"até 7 palavras, em minúsculas","resumo":"${NV().exp}, sem citar o texto bíblico","contexto":"${NV().ctx}","levar":"uma pergunta curta e acolhedora para o dia"}]`);
    let k = 0;
    if (Array.isArray(r)) for (let i = 0; i < alvo.length; i++) { const x = r[i]; if (x && x.resumo) { k++; await saveCap(alvo[i].key, { titulo:String(x.titulo || ''), resumo:String(x.resumo), contexto:String(x.contexto || ''), levar:String(x.levar || '') }); } }
    toast(k ? `${k} ${k === 1 ? 'explicação pronta' : 'explicações prontas'}` : 'não deu certo agora');
  } catch (e) { oops(e); }
  S.busy.semana = false; render();
}

/* conversas: cada uma separada, salvas, e a IA sempre recebe o contexto da pessoa */
const conversa = () => S.conversas[S.chatId] || null;
function chatAbout(){ const c = conversa(); return c ? c.about : refName(cur()); }
function novaConversa(ctx){
  ctx = ctx || 'leitura:' + cur().key;
  const id = 'c' + Date.now().toString(36), agora = new Date().toISOString();
  S.conversas[id] = { id, ctx, about:aboutDe(ctx), titulo:'nova conversa', criado:agora, atualizado:agora, turns:[] };
  S.chatId = id; S.chatView = 'conversa'; LS.set('chatId', id); return S.conversas[id];
}
function contextoIA(c){
  const p = plan(), d = cur(), cap = capOf(d.key), pr = progresso(p), st = streak();
  const L = [`Nome: ${nome() || 'não informado'}.`,
    `Plano de leitura ativo: "${p.nome}". Leitura do dia: ${refName(d)} (dia ${d.i + 1} de ${p.days.length}). Já leu ${pr.n} de ${pr.total} leituras${st ? `, ${st} ${st === 1 ? 'dia seguido' : 'dias seguidos'}` : ''}${pr.atras.length ? `, com ${pr.atras.length} pra colocar em dia` : ''}.`];
  if (cap.resumo) L.push(`Resumo da leitura do dia: ${cap.resumo}${cap.contexto ? ' Contexto: ' + cap.contexto : ''}`);
  const aulas = AULAS.filter(x => S.aulas[x.id]); if (aulas.length) L.push(`Aulas da trilha que já fez (${aulas.length} de ${AULAS.length}): ${aulas.slice(-4).map(x => x.t).join('; ')}.`);
  const notas = Object.values(S.notas).filter(x => x && x.texto).sort((a, b) => String(b.quando).localeCompare(String(a.quando))).slice(0, 3);
  if (notas.length) L.push('Reflexões recentes no diário: ' + notas.map(n => `(${n.nome || n.ref}) "${resumo(n.texto).replace(/…$/, '')}"`).join(' · '));
  const pal = Object.values(S.vocab).slice(-8).map(w => w.palavra); if (pal.length) L.push('Palavras que guardou pra rever: ' + pal.join(', ') + '.');
  const outras = Object.values(S.conversas).filter(x => x.id !== (c && c.id) && x.turns.length).sort((a, b) => String(b.atualizado).localeCompare(String(a.atualizado))).slice(0, 5);
  if (outras.length) L.push('Assuntos de outras conversas recentes: ' + outras.map(x => `"${x.titulo}" (sobre ${x.about})`).join('; ') + '.');
  if (c && /^aula:/.test(c.ctx)) { const a = AULAS.find(x => x.id === c.ctx.slice(5)); if (a) L.push('Resumo da aula desta conversa: ' + a.p.join(' ')); }
  return L.join('\n');
}
async function perguntar(texto, ctx){
  texto = String(texto || '').trim(); if (!texto || S.busy.chat) return;
  let c = conversa();
  if (!c || (ctx && c.ctx !== (ctx === 'leitura' ? 'leitura:' + cur().key : ctx.includes(':') ? ctx : 'aula:' + ctx) && c.turns.length)) c = novaConversa(ctx ? (ctx === 'leitura' ? 'leitura:' + cur().key : ctx.includes(':') ? ctx : 'aula:' + ctx) : null);
  if (S.engine === 'claude' && !S.sample) return abrirClaude(texto);
  if (!aiEngine()) { openChat(); return toast(errCopy('no_ai')); }
  if (!c.turns.length) c.titulo = resumo(texto);
  c.turns.push({ role:'user', content:texto }); c.atualizado = new Date().toISOString();
  S.busy.chat = true; S.chatOpen = true; S.chatView = 'conversa'; render(); scrollEnd();
  const regras = guia() + `\n\nO que você já sabe sobre a pessoa (use quando ajudar, com naturalidade, sem listar tudo):\n${contextoIA(c)}\n\nEsta conversa é sobre ${c.about}. Você está continuando uma conversa: lembre do que já foi dito acima e não se apresente de novo. Responda como numa conversa: curto (até 2 parágrafos), acolhedor e claro. Se pedirem o texto bíblico inteiro, sugira abrir no YouVersion em vez de copiar.`;
  const ctl = S.ctl = new AbortController();
  try {
    const r = await aiChat([{ role:'user', content:regras }, ...c.turns.slice(-40).map(t => ({ role:t.role, content:t.content }))], { signal:ctl.signal,
      onText: t => { const b = document.getElementById('live'); if (b) { b.textContent = clean(t); scrollEnd(); } } });
    c.turns.push({ role:'assistant', content:clean(r.text), by:r.engine });
  } catch (e) {
    if (e && e.text) c.turns.push({ role:'assistant', content:clean(e.text), by:aiEngine() });
    else if (e && e.code !== 'cancelled') c.turns.push({ role:'assistant', content:errCopy(e && e.code), by:'app' });
    else c.turns.pop();
  }
  c.atualizado = new Date().toISOString(); S.busy.chat = false; S.ctl = null;
  await saveConversa(c.id); render(); scrollEnd();
}
function scrollEnd(){ requestAnimationFrame(() => { const b = document.getElementById('sh-body'); if (b) b.scrollTop = b.scrollHeight; }); }
async function testarGemini(){
  if (!S.gkey) return toast('cole sua chave primeiro');
  if (IN_CLAUDE) return toast('o Gemini funciona no app publicado no seu endereço');
  S.busy.teste = true; S.gtest = null; render();
  const ordem = [S.gmodel, ...MODELOS.map(m => m[0]).filter(m => m !== S.gmodel)];
  let ultimo = null;
  for (const m of ordem) {
    try { await geminiCall([{ role:'user', content:'Responda só: ok' }, { role:'user', content:'teste' }], { model:m });
      const trocou = m !== S.gmodel; S.gmodel = m; S.engine = 'gemini'; saveIA();
      S.gtest = { ok:true, msg:'Gemini conectado' + (trocou ? ' (usando ' + (MODELOS.find(x => x[0] === m) || [m, m])[1] + ', que funcionou com a sua chave)' : '') };
      ultimo = null; break; }
    catch (e) { ultimo = e; if (e.code !== 'bad_model' && e.code !== 'upstream') break; }
  }
  if (ultimo) S.gtest = { ok:false, msg:errCopy(ultimo.code) + (ultimo.message && ultimo.message !== ultimo.code ? ' Mensagem do Google: "' + String(ultimo.message).slice(0, 180) + '"' : '') };
  toast(S.gtest.ok ? 'Gemini conectado' : 'não conectou: veja o motivo embaixo do botão');
  S.busy.teste = false; render();
}

/* ---------- foto do perfil: escolher, ajustar (arrastar e zoom) e salvar em 320px ---------- */
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
async function escolherFoto(file){
  try {
    const url = URL.createObjectURL(file), img = await loadImg(url), k = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const src = c.toDataURL('image/jpeg', .85); S.edit = { src, w:c.width, h:c.height, z:1, x:0, y:0 }; render();
  } catch { toast('não deu pra abrir essa foto'); }
}
async function ajustarFoto(){
  try { const img = await loadImg(S.ui.fotoOrig), a = S.ui.ajuste || {}; S.edit = { src:S.ui.fotoOrig, w:img.naturalWidth, h:img.naturalHeight, z:a.z || 1, x:a.x || 0, y:a.y || 0 }; render(); }
  catch { toast('não deu pra abrir a foto'); }
}
function placeCrop(){
  const e = S.edit, box = document.getElementById('crop'), img = document.getElementById('crop-img'); if (!e || !box || !img) return;
  const V = e.V = box.clientWidth, base = V / Math.min(e.w, e.h), W = e.w * base * e.z, H = e.h * base * e.z;
  e.x = Math.max(-(W - V) / 2, Math.min((W - V) / 2, e.x)); e.y = Math.max(-(H - V) / 2, Math.min((H - V) / 2, e.y));
  img.style.width = W + 'px'; img.style.height = H + 'px'; img.style.transform = `translate(calc(-50% + ${e.x}px), calc(-50% + ${e.y}px))`;
}
async function salvarFoto(){
  const e = S.edit; if (!e) return;
  const img = await loadImg(e.src), N = 320, k = N / e.V, base = e.V / Math.min(e.w, e.h), dw = e.w * base * e.z * k, dh = e.h * base * e.z * k;
  const c = document.createElement('canvas'); c.width = c.height = N;
  c.getContext('2d').drawImage(img, N / 2 + e.x * k - dw / 2, N / 2 + e.y * k - dh / 2, dw, dh);
  S.ui.semFoto = false; S.ui.foto = c.toDataURL('image/jpeg', .86); S.ui.fotoOrig = e.src; S.ui.ajuste = { z:e.z, x:e.x, y:e.y }; S.edit = null; saveUI(); render(); toast('foto salva');
}

const podeFalar = () => 'speechSynthesis' in window;
function falar(id, texto){
  const sy = window.speechSynthesis; if (!sy) return toast('este aparelho não tem leitura em voz alta');
  const era = S.falando; sy.cancel(); S.falando = null; pintaFala();
  if (era === id) return;
  const u = new SpeechSynthesisUtterance(texto); u.lang = 'pt-BR'; u.rate = .95;
  const v = sy.getVoices().find(x => /pt[-_]BR/i.test(x.lang)) || sy.getVoices().find(x => /^pt/i.test(x.lang)); if (v) u.voice = v;
  u.onend = u.onerror = () => { if (S.falando === id) { S.falando = null; pintaFala(); } };
  S.falando = id; pintaFala(); sy.speak(u);
}
const falaBtn = (id, cls = 'linkbtn') => podeFalar() ? `<button class="${cls} fala io" data-falar="${esc(id)}" aria-label="${S.falando === id ? 'Parar' : 'Ouvir'}">${ico(S.falando === id ? 'stop' : 'sound')}<span class="bt">${S.falando === id ? 'parar' : 'ouvir'}</span></button>` : '';
function pintaFala(){ document.querySelectorAll('[data-falar]').forEach(b => { const on = S.falando === b.dataset.falar; b.innerHTML = ico(on ? 'stop' : 'sound') + `<span class="bt">${on ? 'parar' : 'ouvir'}</span>`; b.setAttribute('aria-label', on ? 'Parar' : 'Ouvir'); }); }
function textoFala(id){
  if (id === 'exp') { const d = cur(), c = capOf(d.key); return [refName(d) + '.', c.titulo || '', c.resumo || '', c.contexto || '', c.levar ? 'Pra levar no dia: ' + c.levar : ''].join(' '); }
  if (id.startsWith('aula:')) { const a = AULAS.find(x => x.id === id.slice(5)); return a ? [a.t + '.', ...a.p, 'Pra pensar: ' + a.q].join(' ') : ''; }
  if (id.startsWith('msg:')) { const [, cid, i] = id.split(':'); const c = S.conversas[cid]; return c && c.turns[+i] ? c.turns[+i].content : ''; }
  return '';
}

/* ---------- resumo da semana ---------- */
const semanaIni = (d = new Date()) => { const x = day0(d); return addDays(x, -((x.getDay() + 6) % 7)); };
function dadosSemana(){
  const ini = semanaIni(), fim = addDays(ini, 6), dentro = q => { if (!q) return false; const d = day0(typeof q === 'string' && q.length === 10 ? parseISO(q) : new Date(q)); return d >= ini && d <= fim; };
  const leituras = []; allPlans().forEach(p => { const L = lidosOf(p); p.days.forEach(d => { if (L[d.key] && dentro(L[d.key])) leituras.push(refName(d)); }); });
  return { ini, fim, key:iso(ini), leituras, notas:Object.values(S.notas).filter(n => n && n.texto && dentro(n.quando)).length,
    palavras:Object.values(S.vocab).filter(w => dentro(w.quando)).length, versos:Object.values(S.versos).filter(v => dentro(v.quando)).length,
    conversas:Object.values(S.conversas).filter(c => c.turns.length && dentro(c.atualizado)).length };
}
function semanaCard(fechavel){

  const min = !!S.ui.semanaMin;
  return `<section class="card rose semana ${min ? 'min' : ''}">
    <div class="card-h"><span class="label">sua semana</span><span class="hero-r"><span class="pill">${fmtShort(w.ini)} a ${fmtShort(w.fim)}</span><button class="round sm minbtn" data-act="semana-min" aria-expanded="${!min}" aria-label="${min ? 'Abrir resumo da semana' : 'Recolher resumo da semana'}" title="${min ? 'abrir' : 'recolher'}">${ico('right')}</button></span></div>

    ${sp ? `<div class="take"><span class="label" style="font-size:10.5px">pra semana</span><span class="serif">${esc(sp.pergunta)}</span></div>`

async function perguntaSemana(){
  const w = dadosSemana(); if (S.busy.semanaP) return; S.busy.semanaP = true; render();
  try {
    const r = await aiJSON(`Nesta semana a pessoa leu: ${w.leituras.join(', ') || 'nada ainda'}. Escreveu ${w.notas} reflexões no diário. Crie uma pergunta curta, acolhedora e profunda pra ela levar na próxima semana, ligada ao que leu. Responda só com JSON: {"pergunta":"..."}`, true);
    if (r && r.pergunta) { S.ui.semana = { key:w.key, pergunta:String(r.pergunta) }; saveUI(); }

  S.busy.semanaP = false; render();

function heroCard(d){
  const p = plan(), L = lidosOf(p), t = todayIdx(p), pr = progresso(p);
  const depois = p.meta && d.i >= p.meta.dia;
  const label = p.meta ? (depois ? 'depois do ' + p.meta.nome : 'até o ' + p.meta.nome) : p.nome;

  if (p.meta) { const f = diffDays(new Date(), parseISO(p.meta.data)); right = f > 0 ? `faltam ${f} dias pro ${p.meta.nome}` : f === 0 ? `hoje é ${p.meta.nome}` : `até ${fmtShort(p.days[p.days.length-1].date)}`; }

    const q = p.days[i], r = !!L[q.key], c0 = chOf(q.chs[0]);

    week += `<button class="day ${r ? 'read' : ''} ${i === d.i ? 'sel' : ''} ${i === t ? 'today' : ''} ${fut ? 'future' : ''}" ${fut ? `data-fut="${i}" aria-disabled="true"` : `data-sel="${i}"`} aria-label="${esc(refName(q))}, ${esc(fmtLong(q.date))}${r ? ', lido' : fut ? ', ainda não chegou' : ''}">
      <span class="wd">${WD[q.date.getDay()]}</span><span class="sq">${r ? ico('check') : q.date.getDate()}</span><span class="cap">${q.chs.length === 1 ? esc(c0.book.ab + ' ' + c0.cap) : 'dia ' + (i + 1)}</span></button>`;

  return `<section class="card rose">
    <div class="card-h"><span class="label">${esc(label)}</span><span class="hero-r"><span class="pill">${depois ? 'dia ' + (d.i + 1) : `dia ${d.i + 1} de ${pr.total}`}</span><button class="round sm" data-act="foco" aria-label="Modo foco" title="modo foco">${ico('focus')}</button></span></div>

}

    <div class="finish">${read
      ? `<div class="done-ring"><span class="ring">${ico('check')}</span><div><b>leitura concluída</b><span>${esc(refName(d))} · ${esc(fraseDia(d))}</span></div></div><button class="linkbtn muted" data-act="toggle">desmarcar</button>`

function fraseDia(d){ const st = streak(); return st > 1 ? `${st} dias seguidos` : 'um passo de cada vez'; }
function step3(d){
  const c = capOf(d.key), AI = !!aiEngine(), tab = S.step3;
  const seg = `<div class="seg"><button data-s3="palavras" aria-pressed="${tab === 'palavras'}">palavras difíceis</button><button data-s3="versoes" aria-pressed="${tab === 'versoes'}">NTLH e Almeida</button></div>`;
  let body = '';
  if (tab === 'palavras') {
    const list = c.dificeis || [];
    if (S.busy['dif' + d.key] && c.difV !== 'ntlh') body = thinking('procurando o sentido das palavras na NTLH');
    else if (list.length) body = `<div class="gloss">${list.map((w, i) => { const on = !!S.vocab[w.palavra.toLowerCase()];
      return `<div class="g"><div><span class="t">${esc(w.palavra)}</span><span class="s">${esc(w.sentido)}</span></div><button class="star ${on ? 'on' : ''}" data-star="${i}" aria-pressed="${on}" aria-label="${on ? 'Tirar das' : 'Guardar nas'} suas palavras: ${esc(w.palavra)}">${ico('star')}</button></div>`; }).join('')}</div>`;
    else if (S.busy['dif' + d.key] || (AI && !tried.has('dif' + d.key))) body = thinking('procurando o sentido das palavras');
    else body = AI ? `<button class="btn soft" data-act="dificeis">${ico('word')}tentar de novo</button>` : aiOff();
    body += `<form class="ask" data-form="word"><label for="ask-word" class="sr">Palavra que você não entendeu</label>
      <input id="ask-word" type="text" autocomplete="off" placeholder="qual palavra te travou?" ${AI ? '' : 'disabled'}>
      <button class="send" aria-label="Explicar palavra" ${AI ? '' : 'disabled'}>${ico('send')}</button></form>
      ${list.length ? `<p class="hint">A estrela guarda a palavra em caminhada › palavras.</p>` : ''}`;
  } else {
    body = `<div class="side"><div><span class="v ntlh">NTLH</span><span class="small">linguagem de hoje, a mais fácil</span></div><div><span class="v alm">ALMEIDA</span><span class="small">português clássico, tradicional</span></div></div>`;

async function loginEmail(){
  const g = id => (document.getElementById(id) || {}).value || '';
  const email = g('w-email').trim(), senha = g('w-senha'), nm = g('w-nome').trim(), criar = S.wmode === 'criar';
  S.wf = { email, nome:nm }; S.werr = '';
  if (!email || !senha) { S.werr = 'preencha e-mail e senha'; return render(); }
  if (criar && !nm) { S.werr = 'diga como quer ser chamado'; return render(); }
  S.busy.login = true; render();
  try {
    if (criar) { const r = await S.fb.auth.createUserWithEmailAndPassword(email, senha); S.ui.nome = nm; LS.set('ui', S.ui); try { await r.user.updateProfile({ displayName:nm }); } catch {} toast('conta criada'); }
    else { await S.fb.auth.signInWithEmailAndPassword(email, senha); toast('bem-vindo de volta'); }
  } catch (e) { S.werr = loginMsg(e); }
  S.busy.login = false; render();
}
async function esqueciSenha(){
  const email = ((document.getElementById('w-email') || {}).value || '').trim(); S.wf.email = email;
  if (!email) { S.werr = 'escreva seu e-mail acima e toque de novo em "esqueci a senha"'; return render(); }
  try { await S.fb.auth.sendPasswordResetEmail(email); S.werr = ''; toast('mandamos um e-mail pra trocar a senha'); } catch (e) { S.werr = loginMsg(e); }
  render();
}

/* padrão da marca: a última palavra dos títulos fica em itálico dusty */
function duo(root){
  root.querySelectorAll('.title, .card-h .label, .sh-title').forEach(el => {
    if (el.querySelector('em')) return;
    const tn = [...el.childNodes].filter(n => n.nodeType === 3 && n.textContent.trim()).pop(); if (!tn) return;
    const m = tn.textContent.match(/^([\s\S]*?)(\S+)(\s*)$/); if (!m) return;
    const em = document.createElement('em'); em.textContent = m[2]; tn.textContent = m[1];
    if (getComputedStyle(el).display.includes('flex')) { const w = document.createElement('span'); w.className = 'duo'; tn.before(w); w.append(tn, em); }   /* no rótulo com ícone, o espaço entre as palavras fica normal (sem o vão do flex) */
    else { tn.after(em); if (m[3]) em.after(document.createTextNode(m[3])); }
  });
}

function formDias(){

  if (!(n > 0)) return { C, err:'A data de término precisa vir depois do começo.' };

}

function marcar(){
  const p = plan(), d = cur(), L = lidosOf(p);
  if (futuro(p, d.i) || (todayIdx(p) < 0 && !L[d.key])) return toast('essa leitura ainda não chegou');
  if (L[d.key]) delete L[d.key]; else L[d.key] = iso(new Date());
  const agora = !!L[d.key]; if (agora) S.fx.done = true;
  if (agora) S.open = '';

  if (!agora) return;
  const last = chOf(d.chs[d.chs.length-1]), pr = progresso(p);
  if (pr.n === pr.total) toast(p.meta ? `tudo lido até o ${p.meta.nome}` : `plano "${p.nome}" concluído`);
  else if (last.cap === last.book.caps) toast(`você terminou ${last.book.n}`);
  else if (d.i < todayIdx(p) && !pr.atras.length) { S.sel = Math.min(todayIdx(p), p.days.length - 1); S.open = null; S.fx.view = true; render(); window.scrollTo({ top:0, behavior:'smooth' }); toast('tudo em dia! agora é a leitura de hoje'); }
